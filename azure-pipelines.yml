trigger:
  - main

variables:
  # 💡 اطلاعات GitHub شما
  githubUserName: 'alighelejbeigi'
  githubRepoName: 'lms'

  agentPool: 'avid' # نام Agent Pool محلی شما

stages:
  - stage: MirrorCode
    displayName: Mirror Repository to GitHub (WSL/Bash)

    jobs:
      - job: Mirror
        displayName: Execute Git Mirror Push
        pool:
          name: $(agentPool) # استفاده از Agent محلی WSL/Ubuntu شما

        steps:

          # 📢 گام ۱: اجرای اسکریپت در Bash
          - script: |
              echo "Starting Git Mirroring in Bash..."
              
              # 1. تنظیم URL ریموت با استفاده از PAT تزریق شده
              # ما PAT را به عنوان یک متغیر محیطی در دسترس Agent قرار می‌دهیم
              # این متغیر Secret از بخش env در پایین اسکریپت می‌آید.
              GITHUB_URL="https://$(githubUserName):${GITHUB_PAT_SECRET}@github.com/$(githubUserName)/$(githubRepoName).git"
              
              # 2. حذف ریموت قبلی (در صورت وجود)
              git remote remove github-mirror 2>/dev/null || true
              
              # 3. افزودن ریموت جدید
              git remote add github-mirror $GITHUB_URL
              
              # 4. Push کردن Mirror
              # --mirror: تمام شاخه‌ها و تگ‌ها را منعکس می‌کند.
              git push github-mirror --mirror --force
              
              echo "Mirroring successfully completed!"
            displayName: Push Mirror to GitHub via Bash
            # 💡 مهم: تزریق متغیر Secret از Pipeline به متغیر محیطی Shell
            env:
              GITHUB_PAT_SECRET: $(GitHubPAT) # نام متغیر Secret در Pipeline شما