trigger:
  - main

variables:
  # 💡 اطلاعات GitHub شما (حتما جایگزین شود)
  githubUserName: 'alighelejbeigi'
  githubRepoName: 'lms'

  agentPool: 'avid'

stages:
  - stage: MirrorCode
    displayName: Mirror Local Repository to GitHub

    jobs:
      - job: Mirror
        displayName: Execute Git Mirror Push
        pool:
          name: $(agentPool)

        steps:

          # 📢 گام ۱: اجرای اسکریپت برای Push کردن با PAT (که از تنظیمات Pipeline می‌آید)
          - task: PowerShell@2
            displayName: 'Push Mirror to GitHub'
            inputs:
              targetType: 'inline'
              # 💡 در PowerShell، ما می‌توانیم متغیرهای Pipeline را به متغیرهای Shell تبدیل کنیم
              script: |
                Write-Host "Starting Git Mirroring..."
                
                # PAT را به صورت محلی در اسکریپت تعریف می‌کنیم (مقدار آن از متغیر مخفی تزریق می‌شود)
                $GitHubToken = "$(GitHubPAT)"
                $Username = "$(githubUserName)"
                $RepoName = "$(githubRepoName)"
                
                $GitHubUrl = "https://$($Username):$($GitHubToken)@github.com/$($Username)/$($RepoName).git"
                
                # حذف ریموت قبلی (در صورت وجود)
                git remote remove github-mirror 2>$null
                
                # افزودن ریموت جدید
                git remote add github-mirror $GitHubUrl
                
                # Push کردن Mirror
                git push github-mirror --mirror --force
                
                Write-Host "Mirroring successfully completed!"
                Write-Host "Check your GitHub repository: https://github.com/$($Username)/$($RepoName)"

              # 💡 از آنجا که ما متغیرهای Pipeline را مستقیماً در اسکریپت می‌خوانیم، نیازی به بخش env نیست.