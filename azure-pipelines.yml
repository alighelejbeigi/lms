trigger:
  - main
  - dev # 💡 Pipeline با Push به dev هم اجرا می‌شود

variables:
  # 💡 اطلاعات GitHub شما
  githubUserName: 'alighelejbeigi'
  githubRepoName: 'lms'

  agentPool: 'avid' # نام Agent Pool محلی شما

stages:
  - stage: PushSelectedBranches
    displayName: Push Specific Branches to GitHub

    jobs:
      - job: Push
        displayName: Push Main and Dev Branches
        pool:
          name: $(agentPool) # استفاده از Agent محلی WSL/Ubuntu شما

        steps:

          - script: |
              echo "Starting controlled branch push (main and dev)..."
              
              # 1. ساخت URL ریموت با استفاده از PAT تزریق شده
              # متغیر مخفی GITHUB_PAT_SECRET از بخش env می‌آید.
              GITHUB_URL="https://$(githubUserName):${GITHUB_PAT_SECRET}@github.com/$(githubUserName)/$(githubRepoName).git"
              
              # 2. حذف ریموت قبلی (در صورت وجود)
              git remote remove github-mirror 2>/dev/null || true
              
              # 3. افزودن ریموت جدید
              git remote add github-mirror $GITHUB_URL
              
              # 4. Push کردن شاخه main (از Azure DevOps به main در GitHub)
              # --force برای اطمینان از به روز رسانی کامل تاریخچه است.
              echo "Pushing main branch..."
              git push github-mirror main:main --force
              
              # 5. Push کردن شاخه dev (از Azure DevOps به dev در GitHub)
              # این دستور شاخه dev را اگر وجود نداشته باشد، می‌سازد.
              echo "Pushing dev branch..."
              git push github-mirror dev:dev --force
              
              echo "Push completed for main and dev branches."
            displayName: Push Specific Branches via Bash

            env:
              # 💡 متغیر Secret از Pipeline به محیط Shell تزریق می‌شود
              GITHUB_PAT_SECRET: $(GitHubPAT)