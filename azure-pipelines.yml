trigger:
  - main # این Pipeline با هر Push به شاخه main اجرا می‌شود

variables:
  # 💡 این مقادیر را با اطلاعات GitHub خود جایگزین کنید
  githubUserName: 'alighelejbeigi'
  githubRepoName: 'lms'

  # نام Agent Pool محلی شما
  agentPool: 'avid'

stages:
  - stage: MirrorCode
    displayName: Mirror Azure DevOps Repo to GitHub
    jobs:
      - job: Mirror
        displayName: Push Mirror
        pool:
          name: $(agentPool)

        steps:
          # 📢 گام ۱: استفاده از PAT به عنوان متغیر محیطی در اسکریپت
          # PAT قبلاً به عنوان یک Secret Variable در تنظیمات Pipeline ذخیره شده است: $(GitHubPAT)

          - script: |
              echo "Mirroring local repository to GitHub..."
              
              # 1. تنظیم URL ریموت با استفاده از PAT برای احراز هویت
              # از متغیرهای GitHubUserName و GitHubPAT استفاده می‌کند
              GITHUB_URL="https://$(githubUserName):$(GitHubPAT)@github.com/$(githubUserName)/$(githubRepoName).git"
              
              # 2. حذف ریموت قبلی (در صورت وجود)
              git remote remove github-mirror || true
              
              # 3. افزودن ریموت جدید
              git remote add github-mirror $GITHUB_URL
              
              # 4. Mirror کردن (Pushing all branches and tags)
              # --mirror=push تمام شاخه‌ها و تگ‌ها را به صورت Mirror به GitHub Push می‌کند
              git push github-mirror --mirror --force
              
              echo "Mirroring complete. Check https://github.com/$(githubUserName)/$(githubRepoName)"
            displayName: Execute Git Mirror Push
            # 💡 تزریق متغیر Secret به عنوان متغیر محیطی (Environment Variable)
            env:
              GitHubPAT: $(GitHubPAT) # این متغیر Secret از Pipeline می‌آید