trigger:
  - main
  - dev

variables:
  githubUserName: 'alighelejbeigi'
  githubRepoName: 'lms'
  imageRepository: 'flutter-web-app'
  dockerLocalPort: 8090  # 👈 Port جدید
  serverIP: '192.168.192.165'  # 👈 IP سرور
  tag: '$(Build.BuildId)'
  agentPool: 'avid'

stages:
  - stage: MirrorCode
    displayName: 1. Mirror Code to GitHub
    jobs:
      - job: Mirror
        displayName: Git Push Mirror
        pool:
          name: $(agentPool)
        steps:
          - checkout: self
          - script: |
              git branch -f main origin/main
              git branch -f dev origin/dev
              git checkout main
            displayName: Create Local Branches
          - script: |
              git config --global http.sslVerify false
              GITHUB_URL="https://$(githubUserName):${GITHUB_PAT_SECRET}@github.com/$(githubUserName)/$(githubRepoName).git"
              git remote remove github-mirror 2>/dev/null || true
              git remote add github-mirror $GITHUB_URL
              git push github-mirror main:main --force
              git push github-mirror dev:dev --force
            displayName: Push to GitHub
            env:
              GITHUB_PAT_SECRET: $(GitHubPAT)

  - stage: DockerDeploy
    displayName: 2. Flutter Web Deploy
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/dev'))
    jobs:
      - deployment: DeployContainer
        displayName: Build & Deploy
        pool:
          name: $(agentPool)
        environment: 'dev'
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - script: |
                    docker build \
                      --progress=plain \
                      --tag $(imageRepository):$(tag) \
                      --tag $(imageRepository):latest \
                      .
                  displayName: Build Docker Image
                  timeoutInMinutes: 30

                - script: |
                    docker stop $(imageRepository) 2>/dev/null || true
                    docker rm $(imageRepository) 2>/dev/null || true
                    
                    docker run -d \
                      -p $(dockerLocalPort):80 \
                      --name $(imageRepository) \
                      --restart unless-stopped \
                      $(imageRepository):$(tag)
                    
                    sleep 5
                    docker ps --filter "name=$(imageRepository)"
                  displayName: Deploy Container

                - script: |
                    echo "========================================"
                    echo "✅ DEPLOYMENT SUCCESSFUL!"
                    echo "========================================"
                    echo "📱 Local: http://localhost:$(dockerLocalPort)"
                    echo "🌐 Network: http://$(serverIP):$(dockerLocalPort)"
                    echo "🐳 Container: $(imageRepository)"
                    echo "🏷️  Tag: $(tag)"
                    echo "========================================"
                    echo ""
                    echo "🔥 Access from any device in your network:"
                    echo "   http://$(serverIP):$(dockerLocalPort)"
                    echo ""
                    echo "Container Status:"
                    docker ps --filter "name=$(imageRepository)" --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
                  displayName: Deployment Info