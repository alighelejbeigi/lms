trigger:
  - main
  - dev

variables:
  githubUserName: 'alighelejbeigi'
  githubRepoName: 'lms'
  imageRepository: 'flutter-web-app'
  dockerLocalPort: 8080
  tag: '$(Build.BuildId)'
  agentPool: 'avid'

stages:
  # =================================================================
  # STAGE 1: Git Mirroring (Main & Dev)
  # =================================================================
  - stage: MirrorCode
    displayName: 1. Mirror Code to GitHub (Main & Dev)

    jobs:
      - job: Mirror
        displayName: Git Push Mirror
        pool:
          name: $(agentPool)

        steps:
          - checkout: self
            displayName: Checkout Source Code

          - script: |
              echo "Ensuring local branches exist..."
              git branch -f main origin/main
              git branch -f dev origin/dev
              git checkout main
              echo "Local branches main/dev are ready."
            displayName: Create Local Branches
            condition: succeeded()

          - script: |
              echo "Starting Git Push..."
              git config --global http.sslVerify false
              GITHUB_URL="https://$(githubUserName):${GITHUB_PAT_SECRET}@github.com/$(githubUserName)/$(githubRepoName).git"
              git remote remove github-mirror 2>/dev/null || true
              git remote add github-mirror $GITHUB_URL
              echo "Pushing main:main and dev:dev..."
              git push github-mirror main:main --force
              git push github-mirror dev:dev --force
              echo "Mirroring completed."
            displayName: Push Specific Branches to GitHub
            env:
              GITHUB_PAT_SECRET: $(GitHubPAT)

  # =================================================================
  # STAGE 2: Docker Build and Deploy (فقط برای شاخه dev)
  # =================================================================
  - stage: DockerDeploy
    displayName: 2. Flutter Web Deploy (Dev Branch)
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/dev'))

    jobs:
      - deployment: DeployContainer
        displayName: Build & Run Container
        pool:
          name: $(agentPool)

        environment: 'dev'
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                  displayName: Checkout Source Code

                # 🔧 پاک کردن Docker cache قدیمی (اختیاری)
                - script: |
                    echo "Cleaning old Docker resources..."
                    docker system prune -f || true
                  displayName: Clean Docker Cache
                  continueOnError: true

                # 🔧 Build با نمایش لاگ کامل
                - task: Docker@2
                  displayName: Build Flutter Web Image
                  inputs:
                    command: build
                    dockerfile: '$(Build.SourcesDirectory)/Dockerfile'
                    tags: |
                      $(imageRepository):$(tag)
                      $(imageRepository):latest
                    arguments: '--no-cache --progress=plain'

                # 🔧 بررسی موفقیت Build
                - script: |
                    echo "Verifying Docker image..."
                    docker images | grep $(imageRepository)
                  displayName: Verify Docker Image

                # 🔧 Deploy کردن کانتینر
                - script: |
                    echo "Stopping and removing old container (if exists)..."
                    docker stop $(imageRepository) || true
                    docker rm $(imageRepository) || true
                    
                    echo "Deploying new container on host port $(dockerLocalPort)..."
                    docker run -d \
                      -p $(dockerLocalPort):80 \
                      --name $(imageRepository) \
                      --restart unless-stopped \
                      $(imageRepository):$(tag)
                    
                    echo "Waiting for container to start..."
                    sleep 5
                    
                    echo "Checking container status..."
                    docker ps | grep $(imageRepository)
                  displayName: Run Docker Container on Local Server

                # 🔧 تست Health Check
                - script: |
                    echo "Testing application endpoint..."
                    curl -f http://localhost:$(dockerLocalPort) || echo "Warning: App not responding yet"
                    
                    echo "Container logs:"
                    docker logs $(imageRepository) --tail 50
                  displayName: Health Check & Show Logs
                  continueOnError: true

                - script: |
                    echo "✅ Deployment successful!"
                    echo "📱 Access your app at: http://$(Agent.MachineName):$(dockerLocalPort)"
                    echo "🐳 Container name: $(imageRepository)"
                    echo "🏷️  Image tag: $(tag)"
                  displayName: Finalize Deployment Check