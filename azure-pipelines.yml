trigger:
  - main
  - dev # 💡 Pipeline با Push به dev هم اجرا می‌شود

variables:
  # 💡 اطلاعات GitHub شما
  githubUserName: 'alighelejbeigi'
  githubRepoName: 'lms'

  agentPool: 'avid' # نام Agent Pool محلی شما

steps:
  - checkout: self # 💡 گام ۱: Checkout کد (موفق)

  # 📢 گام ۲: ساختن شاخه‌های محلی (جدید)
  - script: |
      echo "Creating local branches for push..."
      
      # ساختن شاخه محلی main از ریموت origin/main
      git checkout main
      
      # ساختن شاخه محلی dev از ریموت origin/dev (اگر وجود داشته باشد)
      # git fetch تمام شاخه‌ها را به صورت origin/dev می‌آورد.
      # این دستور در صورت وجود origin/dev آن را checkout می‌کند.
      git checkout dev 2>/dev/null || true 
      
      echo "Local branches created."
    displayName: Create Local Branches for Mirroring
    condition: succeeded()

  # 📢 گام ۳: Push کردن (گام اصلی)
  - script: |
      echo "Starting controlled branch push (main and dev)..."
      
      # 1. ساخت URL ریموت با استفاده از PAT تزریق شده
      GITHUB_URL="https://$(githubUserName):${GITHUB_PAT_SECRET}@github.com/$(githubUserName)/$(githubRepoName).git"
      
      # 2. حذف ریموت قبلی و افزودن ریموت جدید
      git remote remove github-mirror 2>/dev/null || true
      git remote add github-mirror $GITHUB_URL
      
      # 3. Push کردن شاخه‌ها
      # Push کردن main:main
      git push github-mirror main:main --force
      
      # Push کردن dev:dev (اگر شاخه dev وجود داشته باشد)
      git push github-mirror dev:dev --force
      
      echo "Push completed for main and dev branches."
    displayName: Push Specific Branches via Bash
    env:
      GITHUB_PAT_SECRET: $(GitHubPAT)